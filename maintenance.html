<!DOCTYPE html>
<html lang="hr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#c9a0a0" />
  <title>Cvjećarnica Hilari – stranica se uređuje</title>
  <link rel="icon" type="image/svg+xml" href="/images/favicon.svg" />
  <link rel="stylesheet" href="/fonts/fonts.css" />
  <style>
    :root { --rose: #c9a0a0; --rose-dk: #a87878; --charcoal: #2e2828; --gray: #786f6f; --cream: #fbf8f6; --border: #ece6e3; }
    * { box-sizing: border-box; margin: 0; }
    body { min-height: 100vh; display: grid; place-items: center; padding: 24px; background: var(--cream); color: var(--charcoal); font-family: 'Inter', Arial, sans-serif; line-height: 1.6; }
    main { max-width: 480px; text-align: center; }
    .brand { font-family: 'Great Vibes', cursive; font-size: 3rem; color: var(--rose-dk); line-height: 1.1; }
    h1 { font-family: 'Cormorant Garamond', Georgia, serif; font-weight: 500; font-size: 1.75rem; margin: 16px 0 8px; }
    p { color: var(--gray); }
    .contact { margin-top: 28px; padding-top: 24px; border-top: 1px solid var(--border); display: grid; gap: 6px; }
    a { color: var(--charcoal); font-weight: 500; text-decoration: none; }
    a:hover { color: var(--rose-dk); }
  </style>
</head>
<body>
  <main>
    <div class="brand">Hilari</div>
    <h1>Stranica se trenutno uređuje</h1>
    <p>Uskoro smo ponovno online. Cvjećarnica radi normalno, a narudžbe primamo telefonom i na WhatsApp.</p>
    <div class="contact">
      <a href="tel:+38512992047">01 2992 047</a>
      <a href="https://wa.me/385955309214">WhatsApp: 095 530 9214</a>
      <p>Koledinečka 4, Zagreb</p>
    </div>
  </main>
</body>
</html>
