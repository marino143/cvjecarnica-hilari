name: Deploy to cPanel

# Every push to main pulls the repo on cPanel and runs .cpanel.yml
# (same as Git Version Control → Update from Remote → Deploy HEAD Commit).
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cpanel-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      HOST: ${{ vars.CPANEL_HOST }}
      AUTH: "cpanel ${{ vars.CPANEL_USER }}:${{ secrets.CPANEL_TOKEN }}"
    steps:
      - name: Find cPanel repository
        run: |
          set -euo pipefail
          resp=$(curl -fsS -H "Authorization: $AUTH" "https://$HOST:2083/execute/VersionControl/retrieve")
          echo "$resp" | jq -e . > /dev/null 2>&1 || { echo "cPanel did not return JSON:"; echo "$resp" | head -c 400; exit 1; }
          root=$(echo "$resp" | jq -r '.data[] | select(.source_repository.url // "" | test("cvjecarnica-hilari")) | .repository_root' | head -n1)
          if [ -z "$root" ]; then echo "Repository not found in cPanel: $(echo "$resp" | jq -c '.errors')"; exit 1; fi
          echo "ROOT=$root" >> "$GITHUB_ENV"

      - name: Update from remote
        run: |
          set -euo pipefail
          resp=$(curl -fsS -G -H "Authorization: $AUTH" "https://$HOST:2083/execute/VersionControl/update" \
            --data-urlencode "repository_root=$ROOT" --data-urlencode "branch=main")
          echo "$resp" | jq -e '.status == 1' > /dev/null || { echo "$resp" | jq -c '.errors'; exit 1; }
          echo "cPanel HEAD: $(echo "$resp" | jq -r '.data.last_update.identifier // "?"')"

      - name: Deploy HEAD commit
        run: |
          set -euo pipefail
          resp=$(curl -fsS -G -H "Authorization: $AUTH" "https://$HOST:2083/execute/VersionControlDeployment/create" \
            --data-urlencode "repository_root=$ROOT")
          echo "$resp" | jq -e '.status == 1' > /dev/null || { echo "$resp" | jq -c '.errors'; exit 1; }
          echo "Deployment queued: $(echo "$resp" | jq -r '.data.deploy_id')"

      - name: Wait for deployment
        run: |
          set -euo pipefail
          for i in $(seq 1 20); do
            sleep 3
            last=$(curl -fsS -H "Authorization: $AUTH" "https://$HOST:2083/execute/VersionControlDeployment/retrieve" \
              | jq -c --arg r "$ROOT" '[.data[] | select(.repository_root == $r)] | sort_by(.timestamps.queued // 0) | last')
            if echo "$last" | jq -e '.timestamps.succeeded' > /dev/null; then echo "Deployed: $(echo "$last" | jq -r '.sha')"; exit 0; fi
            if echo "$last" | jq -e '.timestamps.failed' > /dev/null; then echo "Deploy failed: $last"; exit 1; fi
          done
          echo "Deployment still running after 60 s; check cPanel."; exit 1
